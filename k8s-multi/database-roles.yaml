# =============================================================================
# MongoDB Database Pod Roles
# =============================================================================
#
# This file defines the ServiceAccounts, Role, and RoleBinding required for
# MongoDB database pods to function properly in the replica set namespace.
#
# In multi-cluster mode, apply to ALL clusters where MongoDB pods will run.
#
# Apply with: kubectl apply -f database-roles.yaml (all clusters)
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-kubernetes-database-pods
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-kubernetes-database-pods
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-kubernetes-appdb
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-kubernetes-appdb
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-kubernetes-database-pods
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-kubernetes-database-pods
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch, delete, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-kubernetes-database-pods
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-kubernetes-database-pods
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-kubernetes-database-pods
subjects:
  - kind: ServiceAccount
    name: mongodb-kubernetes-database-pods
    namespace: eksrsoppoc1d
