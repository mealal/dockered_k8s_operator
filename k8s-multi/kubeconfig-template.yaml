# =============================================================================
# Combined Kubeconfig Template for Multi-Cluster
# =============================================================================
#
# This template creates a combined kubeconfig file that provides access to
# both central and member clusters in a multi-cluster MongoDB deployment.
#
# Placeholders:
# - {{CENTRAL_CLUSTER_NAME}}: Name of the central Kubernetes cluster
# - {{CENTRAL_SERVER}}: API server URL for central cluster
# - {{CENTRAL_CA_DATA}}: Base64-encoded CA certificate for central cluster
# - {{CENTRAL_CLIENT_CERT}}: Base64-encoded client certificate for central
# - {{CENTRAL_CLIENT_KEY}}: Base64-encoded client key for central cluster
# - {{MEMBER_CLUSTER_NAME}}: Name of the member Kubernetes cluster
# - {{MEMBER_SERVER}}: API server URL for member cluster
# - {{MEMBER_CA_DATA}}: Base64-encoded CA certificate for member cluster
# - {{MEMBER_CLIENT_CERT}}: Base64-encoded client certificate for member
# - {{MEMBER_CLIENT_KEY}}: Base64-encoded client key for member cluster
# - {{CURRENT_CONTEXT}}: The default context to use
#
# Note: This is a kubeconfig file, not a standard Kubernetes resource.
# =============================================================================

apiVersion: v1
kind: Config
preferences: {}
current-context: "{{CURRENT_CONTEXT}}"
clusters:
  - name: "{{CENTRAL_CLUSTER_NAME}}"
    cluster:
      server: "{{CENTRAL_SERVER}}"
      certificate-authority-data: "{{CENTRAL_CA_DATA}}"
  - name: "{{MEMBER_CLUSTER_NAME}}"
    cluster:
      server: "{{MEMBER_SERVER}}"
      certificate-authority-data: "{{MEMBER_CA_DATA}}"
contexts:
  - name: "{{CENTRAL_CLUSTER_NAME}}"
    context:
      cluster: "{{CENTRAL_CLUSTER_NAME}}"
      user: "{{CENTRAL_CLUSTER_NAME}}"
  - name: "{{MEMBER_CLUSTER_NAME}}"
    context:
      cluster: "{{MEMBER_CLUSTER_NAME}}"
      user: "{{MEMBER_CLUSTER_NAME}}"
users:
  - name: "{{CENTRAL_CLUSTER_NAME}}"
    user:
      client-certificate-data: "{{CENTRAL_CLIENT_CERT}}"
      client-key-data: "{{CENTRAL_CLIENT_KEY}}"
  - name: "{{MEMBER_CLUSTER_NAME}}"
    user:
      client-certificate-data: "{{MEMBER_CLIENT_CERT}}"
      client-key-data: "{{MEMBER_CLIENT_KEY}}"
