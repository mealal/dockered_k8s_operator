# =============================================================================
# Pre-Created NodePort Services for MongoDB Multi-Cluster ReplicaSet
# =============================================================================
#
# These services are created BEFORE deploying the MongoDBMultiCluster to ensure
# fixed NodePort values. The MongoDB operator will reuse these services instead
# of creating new ones with random ports.
#
# For multi-cluster deployments, services are named with cluster index:
#   - Central cluster (index 0): mongodb-multi-rs-0-{pod}-svc-external (ports 30100-30102)
#   - Member cluster (index 1): mongodb-multi-rs-1-{pod}-svc-external (ports 30200-30201)
#
# IMPORTANT: This file contains services for BOTH clusters. The automated script
# creates services dynamically for each cluster. For manual deployment, apply only
# the relevant section to each cluster:
#
#   Central cluster: Apply only 0-* services (ports 30100-30102)
#   Member cluster:  Apply only 1-* services (ports 30200-30201)
#
# See MANUAL_DEPLOYMENT_MULTI.md Step 12 for detailed instructions.
# =============================================================================

# -----------------------------------------------------------------------------
# CENTRAL CLUSTER SERVICES (apply to central cluster)
# -----------------------------------------------------------------------------

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-multi-rs-0-0-svc-external
  namespace: eksrsoppoc1d
  labels:
    controller: mongodb-enterprise-operator
    statefulset.kubernetes.io/pod-name: mongodb-multi-rs-0-0
spec:
  type: NodePort
  ports:
  - name: mongodb
    port: 10901
    targetPort: 10901
    nodePort: 30100
  selector:
    controller: mongodb-enterprise-operator
    statefulset.kubernetes.io/pod-name: mongodb-multi-rs-0-0

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-multi-rs-0-1-svc-external
  namespace: eksrsoppoc1d
  labels:
    controller: mongodb-enterprise-operator
    statefulset.kubernetes.io/pod-name: mongodb-multi-rs-0-1
spec:
  type: NodePort
  ports:
  - name: mongodb
    port: 10901
    targetPort: 10901
    nodePort: 30101
  selector:
    controller: mongodb-enterprise-operator
    statefulset.kubernetes.io/pod-name: mongodb-multi-rs-0-1

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-multi-rs-0-2-svc-external
  namespace: eksrsoppoc1d
  labels:
    controller: mongodb-enterprise-operator
    statefulset.kubernetes.io/pod-name: mongodb-multi-rs-0-2
spec:
  type: NodePort
  ports:
  - name: mongodb
    port: 10901
    targetPort: 10901
    nodePort: 30102
  selector:
    controller: mongodb-enterprise-operator
    statefulset.kubernetes.io/pod-name: mongodb-multi-rs-0-2

# -----------------------------------------------------------------------------
# MEMBER CLUSTER SERVICES (apply to member cluster)
# -----------------------------------------------------------------------------

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-multi-rs-1-0-svc-external
  namespace: eksrsoppoc1d
  labels:
    controller: mongodb-enterprise-operator
    statefulset.kubernetes.io/pod-name: mongodb-multi-rs-1-0
spec:
  type: NodePort
  ports:
  - name: mongodb
    port: 10901
    targetPort: 10901
    nodePort: 30200
  selector:
    controller: mongodb-enterprise-operator
    statefulset.kubernetes.io/pod-name: mongodb-multi-rs-1-0

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-multi-rs-1-1-svc-external
  namespace: eksrsoppoc1d
  labels:
    controller: mongodb-enterprise-operator
    statefulset.kubernetes.io/pod-name: mongodb-multi-rs-1-1
spec:
  type: NodePort
  ports:
  - name: mongodb
    port: 10901
    targetPort: 10901
    nodePort: 30201
  selector:
    controller: mongodb-enterprise-operator
    statefulset.kubernetes.io/pod-name: mongodb-multi-rs-1-1
