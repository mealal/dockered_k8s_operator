# =============================================================================
# Member Cluster RBAC
# =============================================================================
#
# This file defines the RBAC resources required on MEMBER clusters in a
# multi-cluster MongoDB deployment. Member clusters do NOT run the operator,
# but need RBAC for database pods and remote operator access.
#
# Apply with: kubectl apply -f member-cluster-rbac.yaml (member clusters only)
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-kubernetes-database-pods
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-kubernetes-database-pods
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-kubernetes-appdb
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-kubernetes-appdb
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-kubernetes-database-pods
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-kubernetes-database-pods
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch, delete, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-kubernetes-database-pods
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-kubernetes-database-pods
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-kubernetes-database-pods
subjects:
  - kind: ServiceAccount
    name: mongodb-kubernetes-database-pods
    namespace: eksrsoppoc1d
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-kubernetes-operator-remote
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-kubernetes-operator-remote
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [mongodb.com]
    resources: ["*"]
    verbs: ["*"]
