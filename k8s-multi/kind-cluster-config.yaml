#
# This template configures a kind (Kubernetes IN Docker) cluster with
# NodePort mappings for external access to MongoDB services.
#
# Placeholders:
# - EXTRA_PORT_MAPPINGS: Dynamic port mappings for MongoDB NodePort services
#
# Note: This is a kind-specific configuration, not a standard Kubernetes resource.
