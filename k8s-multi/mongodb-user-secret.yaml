# =============================================================================
# MongoDB User Password Secret
# =============================================================================
#
# This secret contains the password for the MongoDB SCRAM user.
#
# Apply with: kubectl apply -f mongodb-user-secret.yaml (central cluster)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-admin-password
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-admin-password
    app.kubernetes.io/component: user-credentials
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
type: Opaque
stringData:
  password: "{{MONGODB_USER_PASSWORD}}"
