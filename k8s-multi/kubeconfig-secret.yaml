# =============================================================================
# Multi-Cluster Kubeconfig Secret
# =============================================================================
#
# This secret contains the kubeconfig file that allows MCK (MongoDB Controllers for Kubernetes) to access and manage resources across multiple clusters.
#
# Apply with: kubectl apply -f kubeconfig-secret.yaml (central cluster only)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-kubernetes-operator-multi-cluster-kubeconfig
  namespace: mongodb
  labels:
    app.kubernetes.io/name: mongodb-kubernetes-operator
    app.kubernetes.io/component: kubeconfig
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
type: Opaque
data:
  kubeconfig: {{KUBECONFIG_DATA}}
