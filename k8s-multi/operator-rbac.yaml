# =============================================================================
# MongoDB Enterprise Operator RBAC for Replica Set Namespace
# =============================================================================
#
# This file defines the Role and RoleBinding that allow the MongoDB Enterprise
# Kubernetes Operator to manage resources in the replica set namespace.
#
# Apply with: kubectl apply -f operator-rbac.yaml (central cluster)
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-enterprise-operator
  namespace: mongodb-rs
  labels:
    app.kubernetes.io/name: mongodb-enterprise-operator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [mongodb.com]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-enterprise-operator
  namespace: mongodb-rs
  labels:
    app.kubernetes.io/name: mongodb-enterprise-operator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: deploy-mongodb-k8s-multi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-enterprise-operator
subjects:
  # Support both standard and multi-cluster operator service accounts
  - kind: ServiceAccount
    name: mongodb-enterprise-operator
    namespace: mongodb
  - kind: ServiceAccount
    name: mongodb-enterprise-operator-multi-cluster
    namespace: mongodb
