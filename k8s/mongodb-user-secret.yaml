# =============================================================================
# MongoDB User Password Secret
# =============================================================================
#
# This Secret contains the password for the SCRAM-authenticated MongoDB user.
# The MongoDBUser resource references this secret to set the user's password.
#
# IMPORTANT: Replace the placeholder password with a secure value.
# For production, use a secret management system like Vault.
#
# Apply with: kubectl apply -f mongodb-user-secret.yaml
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-admin-password
  namespace: eksrsoppoc1d
  labels:
    app.kubernetes.io/name: mongodb-user-secret
    app.kubernetes.io/component: credentials
    app.kubernetes.io/managed-by: deploy-mongodb-k8s
type: Opaque
stringData:
  # The password for the MongoDB user
  # This should be a strong, randomly generated password
  password: "{{MONGODB_USER_PASSWORD}}"
