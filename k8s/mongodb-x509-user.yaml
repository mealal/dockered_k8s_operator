# =============================================================================
# MongoDB X509 User
# =============================================================================
#
# This MongoDBUser resource defines a database user that authenticates using
# X509 client certificates. The operator will create this user in the MongoDB
# deployment and manage it through Ops Manager.
#
# The username MUST match the certificate's subject DN as extracted by MongoDB.
# MongoDB extracts the DN in reverse order (most specific first): CN=...,OU=...,O=...
#
# Prerequisites:
#   1. MongoDB deployment with X509 authentication enabled
#   2. TLS enabled on the MongoDB deployment
#   3. Client certificate generated with matching subject DN
#
# Apply with: kubectl apply -f mongodb-x509-user.yaml
# =============================================================================

apiVersion: mongodb.com/v1
kind: MongoDBUser
metadata:
  name: mongodb-x509-user
  namespace: mongodb-rs
  labels:
    app.kubernetes.io/name: mongodb-x509-user
    app.kubernetes.io/component: user
    app.kubernetes.io/managed-by: deploy-mongodb-k8s
spec:
  # Username for X509 authentication
  # Must match the certificate subject DN as extracted by MongoDB (most specific first)
  # Example: CN=x509-user,OU=clients,O=MongoDB
  username: "{{X509_USERNAME}}"

  # Database for X509 users is always $external
  db: "$external"

  # Reference to the MongoDB resource this user belongs to
  mongodbResourceRef:
    name: "{{REPLICA_SET_NAME}}"

  # Roles assigned to this user
  roles:
    - db: "admin"
      name: "clusterAdmin"
    - db: "admin"
      name: "userAdminAnyDatabase"
    - db: "admin"
      name: "readWriteAnyDatabase"
    - db: "admin"
      name: "dbAdminAnyDatabase"
