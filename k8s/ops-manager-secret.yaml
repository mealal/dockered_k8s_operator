# =============================================================================
# Ops Manager API Credentials Secret
# =============================================================================
#
# This secret contains the API keys required for the MongoDB Enterprise
# Kubernetes Operator to communicate with MongoDB Ops Manager.
#
# IMPORTANT: This file is a template. The actual values are populated by
# the deploy_mongodb_k8s.py script from ops-manager-api-key.json.
#
# For manual deployment, replace the placeholder values with your actual
# Ops Manager API credentials:
#   - publicKey: Your Ops Manager public API key
#   - privateKey: Your Ops Manager private API key
#
# To create API keys in Ops Manager:
#   1. Log in to Ops Manager
#   2. Navigate to your Organization > Access Manager > API Keys
#   3. Create a new API key with appropriate permissions
#   4. Copy the public and private keys
#
# Apply with: kubectl apply -f ops-manager-secret.yaml
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  # Secret name - referenced by MongoDB resources via 'credentials' field
  name: ops-manager-admin-key
  # Deploy to the replica set namespace where MongoDB pods run
  namespace: mongodb-rs
  labels:
    app.kubernetes.io/name: ops-manager-credentials
    app.kubernetes.io/component: ops-manager-credentials
    app.kubernetes.io/managed-by: deploy-mongodb-k8s
# Using stringData allows plain text values (automatically base64 encoded)
# For production, consider using sealed-secrets or external secret management
stringData:
  # Ops Manager Public API Key
  # Replace with your actual public key (e.g., "abcdefgh")
  publicKey: "{{PUBLIC_KEY}}"

  # Ops Manager Private API Key
  # Replace with your actual private key (e.g., "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx")
  privateKey: "{{PRIVATE_KEY}}"
