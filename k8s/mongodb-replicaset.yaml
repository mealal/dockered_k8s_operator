# =============================================================================
# MongoDB ReplicaSet Deployment
# =============================================================================
#
# This file defines a MongoDB ReplicaSet managed by the MongoDB Enterprise
# Kubernetes Operator. The operator will:
#   1. Register this deployment with Ops Manager (into the EXISTING project)
#   2. Deploy MongoDB automation agents in each pod
#   3. Configure and manage the replica set through Ops Manager
#
# Security features are ALWAYS enabled:
#   - TLS encryption for all connections
#   - SCRAM + X509 authentication
#   - External connectivity via NodePort
#
# Prerequisites:
#   1. MongoDB Enterprise Kubernetes Operator installed (in 'mongodb' namespace)
#   2. Ops Manager credentials secret created (ops-manager-admin-key)
#   3. Ops Manager connection ConfigMap created (ops-manager-connection)
#   4. MongoDB CA ConfigMap created (mongodb-ca)
#   5. TLS certificate secrets created (mongodb-<rs-name>-cert, mongodb-<rs-name>-agent-certs)
#
# Apply with: kubectl apply -f mongodb-replicaset.yaml
#
# Monitor deployment:
#   kubectl get mongodb -n mongodb-rs -w
#   kubectl describe mongodb mongodb-rs -n mongodb-rs
# =============================================================================

apiVersion: mongodb.com/v1
kind: MongoDB
metadata:
  name: mongodb-rs
  namespace: mongodb-rs
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: deploy-mongodb-k8s
spec:
  # -----------------------------------------------------------------------------
  # Replica Set Configuration
  # -----------------------------------------------------------------------------

  members: 3
  version: "7.0.25-ent"
  type: ReplicaSet

  # -----------------------------------------------------------------------------
  # Ops Manager Connection
  # -----------------------------------------------------------------------------

  opsManager:
    configMapRef:
      name: ops-manager-connection

  credentials: ops-manager-admin-key

  # -----------------------------------------------------------------------------
  # Agent Configuration
  # -----------------------------------------------------------------------------

  agent:
    startupOptions:
      # TLS certificate validation for Ops Manager connection
      # Set to "false" only for testing with self-signed certificates
      tlsRequireValidMMSServerCertificates: "false"

  # -----------------------------------------------------------------------------
  # External Connectivity Configuration (NodePort)
  # -----------------------------------------------------------------------------

  externalAccess:
    externalService:
      spec:
        type: NodePort
        port: 27017

  # Split-horizon DNS configuration for replica set members
  # Maps internal pod hostnames to external localhost:NodePort addresses
  connectivity:
    replicaSetHorizons:
      - "external": "localhost:30000"
      - "external": "localhost:30001"
      - "external": "localhost:30002"

  # -----------------------------------------------------------------------------
  # Storage Configuration
  # -----------------------------------------------------------------------------

  persistent: true

  # -----------------------------------------------------------------------------
  # Pod Configuration
  # -----------------------------------------------------------------------------

  podSpec:
    podTemplate:
      spec:
        containers:
          - name: mongodb-enterprise-database
            env:
              # TLS certificate validation for agent download from Ops Manager
              - name: SSL_REQUIRE_VALID_MMS_CERTIFICATES
                value: "false"
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "1"
                memory: "2Gi"

    persistence:
      single:
        storage: "5Gi"

  # -----------------------------------------------------------------------------
  # Security Configuration (TLS + SCRAM + X509 - Always Enabled)
  # -----------------------------------------------------------------------------

  security:
    # TLS certificate secrets prefix
    certsSecretPrefix: mongodb

    tls:
      ca: mongodb-ca

    authentication:
      enabled: true
      modes: ["SCRAM", "X509"]
      agents:
        mode: SCRAM
      ignoreUnknownUsers: true
